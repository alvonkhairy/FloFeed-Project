<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FloFeed — Login</title>
    <style>
      :root {
        --purple: #6c3fe0;
        --blue: #4e7ff0;
        --purple-light: #efe9fd;
        --purple-text: #7c4deb;
        --grey-bg: #f1f2f5;
        --grey-text: #6b7280;
        --page-bg: #f5f5fa;
        --card-border: #ececf2;
        --ink: #14141f;
        --sub-ink: #7a7a88;
      }

      * {
        box-sizing: border-box;
      }
       body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--page-bg);
    color: var(--ink);
  }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 40px;
        background: #fff;
        border-bottom: 1px solid #ededf2;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-icon {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--purple), var(--blue));
      }
      .brand-name {
        font-size: 20px;
        font-weight: 800;
        color: var(--purple);
      }

      .page {
        max-width: 420px;
        margin: 72px auto;
        padding: 24px;
      }
      .card {
        background: #ffffff;
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 1px 2px rgba(20, 20, 31, 0.03);
      }

      .form-title {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 800;
      }
      .form-sub {
        margin: 0 0 20px;
        color: var(--sub-ink);
      }

      label.field-label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 8px;
      }
      .text-input {
        width: 100%;
        border: 1px solid #e4e4ec;
        background: #fafafc;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 14.5px;
        color: var(--ink);
        outline: none;
        font-family: inherit;
      }
      .text-input:focus {
        border-color: var(--purple);
        background: #fff;
      }
      .input-row {
        margin-bottom: 14px;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 18px;
      }
      .btn {
        flex: 1;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--purple), var(--blue));
        color: #fff;
      }
      .btn-secondary {
        background: #fff;
        border: 1px solid #e4e4ec;
        color: var(--ink);
      }

      .meta {
        margin-top: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--sub-ink);
        font-size: 13px;
      }
      .footer-note {
        text-align: center;
        margin-top: 14px;
        color: var(--sub-ink);
        font-size: 13px;
      }

      @media (max-width: 600px) {
        .topbar {
          padding: 14px 18px;
        }
        .page {
          margin: 40px 16px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon"></div>
        <span class="brand-name">FloFeed</span>
      </div>
      <div></div>
    </header>

    <main class="page">
      <section class="card">
        <h1 class="form-title">Masuk ke FloFeed</h1>
        <p class="form-sub">
          Masukkan akun Anda untuk mengakses room dan membuat pertanyaan.
        </p>

        <form action="#" method="post" aria-label="Login form">
          <div class="input-row">
            <label class="field-label" for="email">Email atau Username</label>
            <input
              id="email"
              name="email"
              class="text-input"
              type="text"
              placeholder="you@domain.com"
              autocomplete="username"
            />
          </div>

          <div class="input-row">
            <label class="field-label" for="password">Kata Sandi</label>
            <input
              id="password"
              name="password"
              class="text-input"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>

          <div class="meta">
            <label
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 600;
                cursor: pointer;
              "
            >
              <input type="checkbox" name="remember" />
              <span style="font-weight: 700; color: var(--sub-ink)"
                >Ingat saya</span
              >
            </label>
            <a
              href="#"
              style="
                color: var(--purple);
                font-weight: 700;
                text-decoration: none;
              "
              >Lupa kata sandi?</a
            >
          </div>

          <div class="actions">
            <button type="button" class="btn btn-secondary">Batal</button>
            <button type="submit" class="btn btn-primary">Masuk</button>
          </div>
        </form>

        <p class="footer-note">
          Belum punya akun?
          <a
            href="#"
            style="
              color: var(--purple);
              font-weight: 700;
              text-decoration: none;
            "
            >Daftar</a
          >
        </p>
      </section>
    </main>
  </body>
</html>
