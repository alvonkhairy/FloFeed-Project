<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloFeed-buat soal</title>
    <style>

:root {
    --purple: #6C3FE0;
    --blue: #4E7FF0;
    --purple-light: #EFE9FD;
    --purple-text: #7C4DEB;
    --grey-bg: #F1F2F5;
    --grey-text: #6B7280;
    --page-bg: #F5F5FA;
    --card-border: #ECECF2;
    --ink: #14141F;
    --sub-ink: #7A7A88;
  }
 
  * {
    box-sizing: border-box;
  }
 
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--page-bg);
    color: var(--ink);
  }
 
  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 40px;
    background: #ffffff;
    border-bottom: 1px solid #EDEDF2;
  }
 
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
 
  .brand-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    flex-shrink: 0;
  }
 
  .brand-name {
    font-size: 20px;
    font-weight: 800;
    color: var(--purple);
    letter-spacing: -0.02em;
  }
 
  .account {
    display: flex;
    align-items: center;
    gap: 10px;
  }
 
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
 
  .account-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
 
  .chevron {
    margin-left: 2px;
    font-size: 12px;
    color: var(--grey-text);
    transition: transform 0.15s ease;
  }

  /* --- Dropdown account menu (details/summary, tanpa JS) --- */
  .account {
    position: relative;
  }

  .account-trigger {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    list-style: none;
    user-select: none;
  }

  .account-trigger::-webkit-details-marker {
    display: none;
  }

  .account[open] .chevron {
    transform: rotate(180deg);
  }

  .account-panel {
    position: absolute;
    right: 0;
    top: calc(100% + 10px);
    width: 240px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(20, 20, 31, 0.12);
    overflow: hidden;
    z-index: 20;
  }

  .account-info {
    padding: 18px 20px;
  }

  .account-info .name {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
  }

  .account-info .email {
    margin: 0;
    font-size: 13.5px;
    color: var(--sub-ink);
  }

  .account-divider {
    height: 1px;
    background: #ECECF2;
  }

  .logout-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 14px 20px;
    background: #FDEEEE;
    border: none;
    color: #E5484D;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }

  .logout-btn:hover {
    background: #FBDCDC;
  }

  /* Page layout */
  .page {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 24px 64px;
  }
 
  .page-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }
 
  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(20, 20, 31, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 18px;
    color: var(--ink);
  }
 
  .back-btn:hover {
    background: #f3f3f8;
  }
 
  .page-title-group h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
 
  .page-title-group p {
    margin: 4px 0 0;
    font-size: 14px;
    color: var(--sub-ink);
  }
 
  /* Cards */
  .card {
    background: #ffffff;
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(20, 20, 31, 0.03);
  }
 
  .field-label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 10px;
  }
 
  .text-input {
    width: 100%;
    border: 1px solid #E4E4EC;
    background: #FAFAFC;
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
    font-family: inherit;
    display: block;
  }
 
  .text-input:focus {
    border-color: var(--purple);
    background: #ffffff;
  }
 
  .text-input + .text-input {
    margin-top: 12px;
  }
 
  .placeholder-input::placeholder {
    color: #B4B4C0;
  }
 
  .question-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
 
  .pill {
    display: inline-flex;
    align-items: center;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }
 
  .pill-purple {
    background: var(--purple-light);
    color: var(--purple-text);
  }
 
  .pill-grey {
    background: var(--grey-bg);
    color: var(--grey-text);
  }
 
  /* Add question button */
  .add-question-btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: 1.5px dashed #D6D6E2;
    background: transparent;
    color: var(--grey-text);
    font-size: 14.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    margin-bottom: 28px;
  }
 
  .add-question-btn:hover {
    background: #FBFBFD;
    border-color: #C7C7D6;
  }
 
  .plus {
    font-size: 16px;
    font-weight: 700;
  }
 
  /* Bottom actions */
  .actions {
    display: flex;
    gap: 16px;
  }
 
  .btn {
    flex: 1;
    padding: 15px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
 
  .btn-secondary {
    background: #ffffff;
    border: 1px solid #E4E4EC;
    color: var(--ink);
  }
 
  .btn-secondary:hover {
    background: #F7F7FA;
  }
 
  .btn-primary {
    background: linear-gradient(135deg, var(--purple), var(--blue));
    color: #ffffff;
  }
 
  .btn-primary:hover {
    filter: brightness(1.05);
  }
 
  .arrow {
    font-size: 16px;
  }
 
  /* Responsive */
  @media (max-width: 600px) {
    .topbar {
      padding: 14px 20px;
    }
    .page {
      padding: 28px 16px 48px;
    }
    .actions {
      flex-direction: column;
    }
  }

    </style>

</head>
<body>
    <header class="topbar">

        <div class="brand">
            <div class="brand-icon"> </div>
            <span class="brand-name">FloFeed</span>
        </div>

        <details class="account">
            <summary class="account-trigger">
                <span class="avatar">UN</span>
                <span class="account-name">Upik Nambo</span>
                <span class="chevron">&#9662;</span>
            </summary>
            <div class="account-panel">
                <div class="account-info">
                    <p class="name">Upik Nambo</p>
                    <p class="email">UpNam@email.com</p>
                </div>
                <div class="account-divider"></div>
                <button class="logout-btn">
                    <span class="logout-icon">&#8618;</span>
                    Logout
                </button>
            </div>
        </details>

    </header>

    <main class ="page">
        <div class="page-header">
            <button class="back-btn" aria-label="Kembali">&larr;</button> 
            <div class="page-title-group">
                <h1>Buat Room Baru</h1>
                <p>Rancang pertanyaan untuk peserta Anda</p>
            </div>
        </div>

        <section class="card">
            <label class="field-label" for="judul-room">Judul Room</label>
            <input class="text-input" id="judul-room" type="text" value="Evaluasi Pembelajaran Hari Ini">
        </section>

        <section class="card question-card">
            <div class="question-head">
                <span class="pill pill-purple">Pertanyaan 1</span>
                <span class="pill pill-grey">Teks Bebas</span>
            </div>
            <input class="text-input" type="text" value="bagaimana menurutmu materi hari ini?">
            <input class="text-input placeholder-input" type="text" placeholder="Peserta akan mengetik jawaban di sini...">
        </section>

        <section class="card question-card">
            <div class="question-head">
                <span class="pill pill-purple">Pertanyaan 2</span>
                <span class="pill pill-grey">Teks Bebas</span>
            </div>
            <input class="text-input" type="text" value="Apa saran untuk perbaikan?">
            <input class="text-input placeholder-input" type="text" placeholder="Peserta akan mengetik jawaban di sini...">
        </section>

        <button class="add-question-btn">
            <span class="plus">+</span>Tambah Pertanyaan
        </button>

        <div class="actions">
            <button  class="btn btn-secondary">Batal</button>
            <button  class="btn btn-primary">Simpan<span class="arrow">&rarr;</span></button>
        </div>
    </main>

</body>
</html>
